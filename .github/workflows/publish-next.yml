name: Publish npm prerelease

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full 40-character main commit to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: devkit-npm-next
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'slicemedia/devkit' && github.event.repository.private == false && github.ref == 'refs/heads/main' && vars.SLICEMEDIA_NPM_PUBLISH_NEXT_ENABLED == 'true'
    environment: release-sanitize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current main before repository code
        shell: bash
        env:
          SLICEMEDIA_RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          if [[ ! "$SLICEMEDIA_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_commit must be a full lowercase commit SHA" >&2
            exit 1
          fi
          for variable in NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_TOKEN NPM_CONFIG__AUTH NPM_CONFIG__AUTHTOKEN NPM_CONFIG_REGISTRY NPM_CONFIG_USERCONFIG NPM_CONFIG_GLOBALCONFIG YARN_NPM_AUTH_TOKEN npm_config_token npm_config__auth npm_config__authtoken npm_config_registry npm_config_userconfig npm_config_globalconfig; do
            if [[ -n "${!variable:-}" ]]; then
              echo "$variable must not be present in the release workflow" >&2
              exit 1
            fi
          done
          head_commit="$(git rev-parse --verify HEAD^{commit})"
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test "$SLICEMEDIA_RELEASE_COMMIT" = "$GITHUB_SHA"
          test "$SLICEMEDIA_RELEASE_COMMIT" = "$head_commit"
          test "$SLICEMEDIA_RELEASE_COMMIT" = "$remote_main"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Require private release denylist
        shell: bash
        env:
          SLICEMEDIA_FORBIDDEN_TERMS: ${{ secrets.SLICEMEDIA_FORBIDDEN_TERMS }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'const raw = process.env.SLICEMEDIA_FORBIDDEN_TERMS?.trim() ?? ""; let terms = []; try { terms = raw.startsWith("[") ? JSON.parse(raw) : raw.split(/[\n,]/u); } catch { process.exit(1); } if (!Array.isArray(terms) || !terms.every((term) => typeof term === "string") || !terms.some((term) => term.trim() !== "")) process.exit(1);'
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - name: Install reviewed npm CLI with isolated configuration
        shell: bash
        run: |
          set -euo pipefail
          npm_config_directory="$(mktemp -d)"
          npm_user_config=""
          npm_global_config=""
          cleanup_npm_configs() {
            local status=$?
            local cleanup_failed=0
            trap - EXIT
            set +e
            if [[ -n "$npm_user_config" ]]; then
              rm -f -- "$npm_user_config" || cleanup_failed=1
            fi
            if [[ -n "$npm_global_config" ]]; then
              rm -f -- "$npm_global_config" || cleanup_failed=1
            fi
            rmdir -- "$npm_config_directory" || cleanup_failed=1
            if [[ "$cleanup_failed" -ne 0 ]]; then
              exit 1
            fi
            exit "$status"
          }
          trap cleanup_npm_configs EXIT
          umask 077
          npm_user_config="$(mktemp "$npm_config_directory/user.XXXXXX")"
          npm_global_config="$(mktemp "$npm_config_directory/global.XXXXXX")"
          if [[ "$npm_user_config" == "$npm_global_config" || "$npm_user_config" -ef "$npm_global_config" ]]; then
            echo "npm user and global configuration must be distinct files" >&2
            exit 1
          fi
          test -f "$npm_user_config" && test ! -s "$npm_user_config"
          test -f "$npm_global_config" && test ! -s "$npm_global_config"
          npm install --global npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org/ --userconfig="$npm_user_config" --globalconfig="$npm_global_config"
      - name: Prefer reviewed npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm_global_prefix="$(npm prefix -g)"
          if [[ "$npm_global_prefix" != /* || "$npm_global_prefix" == *:* || "$npm_global_prefix" == *$'\n'* || "$npm_global_prefix" == *$'\r'* ]]; then
            echo "npm global prefix is not a safe absolute PATH entry" >&2
            exit 1
          fi
          npm_global_bin="${npm_global_prefix%/}/bin"
          if [[ ! -d "$npm_global_bin" || ! -x "$npm_global_bin/npm" ]]; then
            echo "reviewed npm executable was not found in the global npm bin directory" >&2
            exit 1
          fi
          export PATH="$npm_global_bin:$PATH"
          if [[ "$(command -v npm)" != "$npm_global_bin/npm" || "$(npm --version)" != "11.19.0" ]]; then
            echo "reviewed npm 11.19.0 is not first on PATH" >&2
            exit 1
          fi
          if [[ -z "${GITHUB_PATH:-}" || "$GITHUB_PATH" != /* || "$GITHUB_PATH" == *$'\n'* || "$GITHUB_PATH" == *$'\r'* ]]; then
            echo "GITHUB_PATH is not a safe absolute command-file path" >&2
            exit 1
          fi
          printf '%s\n' "$npm_global_bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:registry-release-candidate
      - run: pnpm release:archive
        env:
          SLICEMEDIA_RELEASE_COMMIT: ${{ inputs.release_commit }}
      - name: Sanitize source, history, generated files, and release archives
        run: pnpm sanitize -- --json
        env:
          SLICEMEDIA_FORBIDDEN_TERMS: ${{ secrets.SLICEMEDIA_FORBIDDEN_TERMS }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devkit-npm-${{ inputs.release_commit }}-${{ github.run_attempt }}
          path: .npm-release
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          compression-level: 0

  publish:
    needs: prepare
    if: github.repository == 'slicemedia/devkit' && github.event.repository.private == false && github.ref == 'refs/heads/main' && vars.SLICEMEDIA_NPM_PUBLISH_NEXT_ENABLED == 'true' && needs.prepare.result == 'success'
    environment: npm-next
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current main before repository code
        shell: bash
        env:
          SLICEMEDIA_RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          if [[ ! "$SLICEMEDIA_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_commit must be a full lowercase commit SHA" >&2
            exit 1
          fi
          for variable in NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_TOKEN NPM_CONFIG__AUTH NPM_CONFIG__AUTHTOKEN NPM_CONFIG_REGISTRY NPM_CONFIG_USERCONFIG NPM_CONFIG_GLOBALCONFIG YARN_NPM_AUTH_TOKEN npm_config_token npm_config__auth npm_config__authtoken npm_config_registry npm_config_userconfig npm_config_globalconfig; do
            if [[ -n "${!variable:-}" ]]; then
              echo "$variable must not be present in the release workflow" >&2
              exit 1
            fi
          done
          head_commit="$(git rev-parse --verify HEAD^{commit})"
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test "$SLICEMEDIA_RELEASE_COMMIT" = "$GITHUB_SHA"
          test "$SLICEMEDIA_RELEASE_COMMIT" = "$head_commit"
          test "$SLICEMEDIA_RELEASE_COMMIT" = "$remote_main"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: false
      - name: Install reviewed npm CLI with isolated configuration
        shell: bash
        run: |
          set -euo pipefail
          npm_config_directory="$(mktemp -d)"
          npm_user_config=""
          npm_global_config=""
          cleanup_npm_configs() {
            local status=$?
            local cleanup_failed=0
            trap - EXIT
            set +e
            if [[ -n "$npm_user_config" ]]; then
              rm -f -- "$npm_user_config" || cleanup_failed=1
            fi
            if [[ -n "$npm_global_config" ]]; then
              rm -f -- "$npm_global_config" || cleanup_failed=1
            fi
            rmdir -- "$npm_config_directory" || cleanup_failed=1
            if [[ "$cleanup_failed" -ne 0 ]]; then
              exit 1
            fi
            exit "$status"
          }
          trap cleanup_npm_configs EXIT
          umask 077
          npm_user_config="$(mktemp "$npm_config_directory/user.XXXXXX")"
          npm_global_config="$(mktemp "$npm_config_directory/global.XXXXXX")"
          if [[ "$npm_user_config" == "$npm_global_config" || "$npm_user_config" -ef "$npm_global_config" ]]; then
            echo "npm user and global configuration must be distinct files" >&2
            exit 1
          fi
          test -f "$npm_user_config" && test ! -s "$npm_user_config"
          test -f "$npm_global_config" && test ! -s "$npm_global_config"
          npm install --global npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org/ --userconfig="$npm_user_config" --globalconfig="$npm_global_config"
      - run: test "$(npm --version)" = "11.19.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: devkit-npm-${{ inputs.release_commit }}-${{ github.run_attempt }}
          path: .npm-release
      - run: node scripts/assert-npm-publication-artifact.mjs
        env:
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          SLICEMEDIA_NPM_PUBLISH_NEXT_ENABLED: ${{ vars.SLICEMEDIA_NPM_PUBLISH_NEXT_ENABLED }}
          SLICEMEDIA_RELEASE_COMMIT: ${{ inputs.release_commit }}
          SLICEMEDIA_RELEASE_ENVIRONMENT: npm-next
      - name: Verify current main immediately before publication
        shell: bash
        env:
          SLICEMEDIA_RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          test "$SLICEMEDIA_RELEASE_COMMIT" = "$GITHUB_SHA"
          test "$SLICEMEDIA_RELEASE_COMMIT" = "$(git rev-parse --verify HEAD^{commit})"
          test "$SLICEMEDIA_RELEASE_COMMIT" = "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(npm --version)" = "11.19.0"
      - run: node scripts/publish-next.mjs
        env:
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          SLICEMEDIA_NPM_PUBLISH_NEXT_ENABLED: ${{ vars.SLICEMEDIA_NPM_PUBLISH_NEXT_ENABLED }}
          SLICEMEDIA_RELEASE_COMMIT: ${{ inputs.release_commit }}
          SLICEMEDIA_RELEASE_ENVIRONMENT: npm-next

  verify:
    needs:
      - prepare
      - publish
    if: github.repository == 'slicemedia/devkit' && github.event.repository.private == false && github.ref == 'refs/heads/main' && vars.SLICEMEDIA_NPM_PUBLISH_NEXT_ENABLED == 'true' && needs.prepare.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify approved commit before repository code
        shell: bash
        env:
          SLICEMEDIA_RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          test "$SLICEMEDIA_RELEASE_COMMIT" = "$GITHUB_SHA"
          test "$SLICEMEDIA_RELEASE_COMMIT" = "$(git rev-parse --verify HEAD^{commit})"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: devkit-npm-${{ inputs.release_commit }}-${{ github.run_attempt }}
          path: .npm-release
      - run: node scripts/verify-npm-publication.mjs
        env:
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          SLICEMEDIA_RELEASE_COMMIT: ${{ inputs.release_commit }}
