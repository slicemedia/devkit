name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.13.0
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22.13.0
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@${{ matrix.node }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  packed-consumer:
    strategy:
      fail-fast: false
      matrix:
        node: [22.13.0, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@${{ matrix.node }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:packed-consumer
      - run: pnpm -r --filter './packages/*' pack --pack-destination "${{ runner.temp }}/packs"
      - name: Generic source and history sanitization
        run: node packages/cli/dist/bin.js sanitize --root . --ignore .private --git-history --json
      - name: Generic package archive sanitization
        run: node packages/cli/dist/bin.js sanitize --root "${{ runner.temp }}/packs" --json

  private-sanitization:
    needs: packed-consumer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: release-sanitize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -r --filter './packages/*' pack --pack-destination "${{ runner.temp }}/packs"
      - name: Require private sanitization rules on trusted main
        env:
          SLICEMEDIA_FORBIDDEN_TERMS: ${{ secrets.SLICEMEDIA_FORBIDDEN_TERMS }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e 'const raw = process.env.SLICEMEDIA_FORBIDDEN_TERMS?.trim() ?? ""; let terms = []; try { terms = raw.startsWith("[") ? JSON.parse(raw) : raw.split(/[\n,]/u); } catch { process.exit(1); } if (!Array.isArray(terms) || !terms.every((term) => typeof term === "string") || !terms.some((term) => term.trim() !== "")) process.exit(1);'
      - name: Private source and history sanitization
        run: node packages/cli/dist/bin.js sanitize --root . --ignore .private --git-history --json
        env:
          SLICEMEDIA_FORBIDDEN_TERMS: ${{ secrets.SLICEMEDIA_FORBIDDEN_TERMS }}
      - name: Private package archive sanitization
        run: node packages/cli/dist/bin.js sanitize --root "${{ runner.temp }}/packs" --json
        env:
          SLICEMEDIA_FORBIDDEN_TERMS: ${{ secrets.SLICEMEDIA_FORBIDDEN_TERMS }}
